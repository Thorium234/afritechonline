name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: afritechonline
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install dependencies
        run: cd backend && go mod download
      - name: Run tests
        run: cd backend && go test ./...
        env:
          JWT_SECRET: test-secret
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: afritechonline
          DB_USER: root
          DB_PASSWORD: root
